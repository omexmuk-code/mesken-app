<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Mesken Real Estate</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#08111F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mesken">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root{
    --bg:#F3F8FD; --surface:#FFFFFF; --surface-alt:#EAF3FB; --border:#D8E7F5;
    --text:#0F2438; --text-muted:#5C7A96; --accent:#2E7BC4; --accent-ink:#FFFFFF;
    --accent-soft:#DCEEFB; --success:#1E9E6C; --success-soft:#DEF6EC;
    --danger:#D1495B; --danger-soft:#FBE3E7; --warning:#B9790C; --warning-soft:#FBF0DA;
    --shadow: 0 1px 2px rgba(15,36,56,0.06), 0 8px 24px rgba(15,36,56,0.05);
    --radius: 14px;
  }
  [data-theme="dark"]{
    --bg:#08111F; --surface:#101C30; --surface-alt:#16243B; --border:#213249;
    --text:#E7F0FA; --text-muted:#8FA7C2; --accent:#5EB2F7; --accent-ink:#04182B;
    --accent-soft:#173250; --success:#3FCE95; --success-soft:#12301F;
    --danger:#FF7B87; --danger-soft:#3A1620; --warning:#F5B94D; --warning-soft:#332409;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  #app{
    font-family:'Inter','Noto Sans Ethiopic','Nyala','Abyssinica SIL',sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; padding:20px 14px 70px;
    transition:background .25s ease, color .25s ease;
  }
  @media (min-width:640px){ #app{ padding:28px 20px 80px; } }
  .wrap{max-width:1120px; margin:0 auto;}
  h1,h2,h3,.num{font-family:'Sora','Noto Sans Ethiopic','Nyala',sans-serif;}

  .topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  .brand-mark{width:36px; height:36px; border-radius:10px; background:linear-gradient(155deg,var(--accent),var(--accent-soft)); position:relative; flex:none;}
  .brand-mark::after{content:""; position:absolute; inset:8px; border:2px solid var(--surface); border-radius:4px;}
  .title-row{display:flex; align-items:center; gap:10px;}
  h1{font-size:19px; font-weight:800; margin:0; letter-spacing:-0.01em;}
  @media (min-width:640px){ h1{font-size:22px;} .brand-mark{width:40px;height:40px;} }
  .brandline{font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--accent); margin:0 0 1px 46px;}
  .subtitle{color:var(--text-muted); font-size:12.5px; margin:2px 0 18px 46px;}
  @media (min-width:640px){ .brandline,.subtitle{margin-left:52px;} .subtitle{font-size:13.5px; margin-bottom:22px;} }
  .toggles{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .toggle{
    display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border);
    padding:6px 10px; border-radius:999px; cursor:pointer; box-shadow:var(--shadow); user-select:none;
    font-size:12.5px; color:var(--text-muted); white-space:nowrap;
  }
  .toggle .dot{width:15px;height:15px;border-radius:50%;background:var(--accent); transition:transform .2s ease;}
  [data-theme="dark"] .toggle .dot{transform:translateX(2px);}
  .who{font-size:12px; color:var(--text-muted);}

  .backlink{display:flex; align-items:center; gap:6px; color:var(--text-muted); font-size:13px; font-weight:600; cursor:pointer; margin-bottom:12px; width:fit-content; padding:4px 0;}
  .backlink:hover{color:var(--accent);}

  .cards{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:22px;}
  @media (min-width:560px){ .cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));} }
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 14px 12px; box-shadow:var(--shadow); min-width:0;}
  .card .lbl{font-size:11px; color:var(--text-muted); font-weight:500; margin-bottom:6px;}
  .card .num{font-size:16px; font-weight:700; letter-spacing:-0.01em; word-break:break-word;}
  @media (min-width:640px){ .card .num{font-size:20px;} .card{padding:16px 16px 14px;} }
  .card .sub{font-size:11px; color:var(--text-muted); margin-top:4px;}
  .card.accent{background:linear-gradient(160deg, var(--accent), #1c5f9c); color:#fff; border:none; grid-column:span 2;}
  @media (min-width:560px){ .card.accent{grid-column:auto;} }
  [data-theme="dark"] .card.accent{background:linear-gradient(160deg, var(--accent), #143a5c); color:var(--accent-ink);}
  .card.accent .lbl{color:rgba(255,255,255,.8);}
  [data-theme="dark"] .card.accent .lbl{color:rgba(4,24,43,.65);}
  .card.accent .sub{color:rgba(255,255,255,.75);}
  [data-theme="dark"] .card.accent .sub{color:rgba(4,24,43,.6);}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .section-head h2{font-size:16px; margin:0;}

  .proj-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin-bottom:10px;}
  .proj-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:var(--shadow); cursor:pointer; position:relative; transition:border-color .15s ease, transform .12s ease;}
  .proj-card:hover{border-color:var(--accent); transform:translateY(-1px);}
  .proj-card .pname{font-weight:700; font-size:15.5px; margin-bottom:2px; padding-right:50px;}
  .proj-card .pmeta{font-size:11.5px; color:var(--text-muted); margin-bottom:12px;}
  .proj-stat{display:flex; justify-content:space-between; font-size:12px; padding:5px 0; border-top:1px dashed var(--border);}
  .proj-stat span:first-child{color:var(--text-muted);}
  .proj-stat b{font-weight:600;}
  .proj-actions{position:absolute; top:12px; right:12px; display:flex; gap:4px;}
  .icon-btn{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); cursor:pointer; font-size:15px; background:var(--surface-alt);}
  .icon-btn:hover{color:var(--accent);}
  .add-proj-card{border:1.5px dashed var(--border); border-radius:16px; display:flex; align-items:center; justify-content:center; min-height:110px; cursor:pointer; color:var(--text-muted); font-weight:600; font-size:13px; gap:6px;}
  .add-proj-card:hover{border-color:var(--accent); color:var(--accent);}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{padding:9px 4px; margin-right:16px; font-size:13.5px; font-weight:600; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; position:relative; top:1px; white-space:nowrap; flex:none;}
  .tab.active{color:var(--accent); border-bottom-color:var(--accent);}

  .toolbar{display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  input, select, textarea{font-family:inherit; font-size:16px; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:10px 12px; outline:none;}
  @media (min-width:640px){ input, select, textarea{ font-size:14px; } }
  input:focus, select:focus, textarea:focus{border-color:var(--accent);}
  .search{flex:1; min-width:150px;}
  .btn{font-family:inherit; font-weight:600; font-size:13.5px; border-radius:9px; border:1px solid transparent; padding:10px 15px; cursor:pointer; white-space:nowrap; min-height:40px;}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:var(--surface); color:var(--text); border-color:var(--border);}
  .btn-danger{background:var(--danger-soft); color:var(--danger);}
  .btn-sm{padding:7px 10px; font-size:12px; min-height:32px;}
  .btn[disabled]{opacity:.55; cursor:default;}

  .list{display:flex; flex-direction:column; gap:8px;}
  .row{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 14px; display:grid; grid-template-columns:1fr; gap:6px; align-items:center; cursor:pointer; transition:border-color .15s ease;}
  @media (min-width:820px){ .row{grid-template-columns:1.6fr 1fr 1fr 1fr 1fr auto; padding:13px 16px; gap:10px;} }
  .row:hover{border-color:var(--accent);}
  .row .name{font-weight:600; font-size:14.5px;}
  .row .meta{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .row .mrow{display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-muted);}
  .row .mrow b{color:var(--text); font-weight:600;}
  .colhead{display:none;}
  @media (min-width:820px){ .colhead{display:grid; grid-template-columns:1.6fr 1fr 1fr 1fr 1fr auto; gap:10px; padding:0 16px 6px; font-size:11.5px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em;} }
  .amt{font-variant-numeric:tabular-nums; font-size:13.5px;}
  .badge{display:inline-block; font-size:11px; font-weight:600; padding:4px 10px; border-radius:999px; width:fit-content;}
  .badge.paid{background:var(--success-soft); color:var(--success);}
  .badge.owed{background:var(--warning-soft); color:var(--warning);}
  .badge.none{background:var(--surface-alt); color:var(--text-muted);}
  .bar-bg{height:5px; background:var(--surface-alt); border-radius:4px; overflow:hidden; margin-top:5px;}
  .bar-fill{height:100%; background:var(--accent); border-radius:4px;}

  .overlay{position:fixed; inset:0; background:rgba(6,14,24,.45); display:flex; justify-content:flex-end; z-index:50; opacity:0; pointer-events:none; transition:opacity .18s ease;}
  .overlay.open{opacity:1; pointer-events:auto;}
  .overlay.center{justify-content:center; align-items:center; padding:14px;}
  .drawer{width:min(430px,100vw); background:var(--bg); height:100%; padding:20px 16px 40px; overflow-y:auto; transform:translateX(16px); transition:transform .18s ease; border-left:1px solid var(--border);}
  @media (min-width:640px){ .drawer{padding:24px 22px 40px;} }
  .overlay.open .drawer{transform:translateX(0);}
  .modal{width:min(430px,100%); background:var(--bg); border-radius:16px; padding:18px; border:1px solid var(--border); max-height:88vh; overflow-y:auto; transform:translateY(10px); transition:transform .18s ease;}
  @media (min-width:640px){ .modal{padding:22px;} }
  .overlay.open .modal{transform:translateY(0);}
  .drawer-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px; gap:10px;}
  .close-x{cursor:pointer; color:var(--text-muted); font-size:22px; line-height:1; padding:6px; flex:none;}
  .field{margin-bottom:12px; display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; font-weight:600; color:var(--text-muted);}
  .field input, .field select, .field textarea{width:100%;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin:18px 0 10px;}
  .stat-row{display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px dashed var(--border); gap:10px;}
  .stat-row span:first-child{color:var(--text-muted); flex:none;}
  .stat-row span:last-child{text-align:right;}
  .pay-item{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .pay-item .d{font-size:11.5px; color:var(--text-muted);}
  .pay-item .n{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .empty{text-align:center; color:var(--text-muted); font-size:13px; padding:36px 10px;}
  .form-actions{display:flex; gap:8px; margin-top:16px;}
  .form-actions .btn{flex:1;}
  .hint{font-size:11.5px; color:var(--text-muted); margin-top:-6px; margin-bottom:10px;}

  .exp-row{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; margin-bottom:8px;}
  @media (min-width:760px){ .exp-row{display:grid; grid-template-columns:96px 1fr 170px 120px auto; gap:12px; align-items:center;} }
  .exp-row .cat{font-size:11px; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:999px; width:fit-content;}
  .exp-row .cat.income{color:var(--success); background:var(--success-soft);}
  .exp-row .amt{font-weight:600;}
  .exp-row .amt.income{color:var(--success);}
  .exp-toolbar-extra{font-size:12px; color:var(--text-muted);}

  .tr-row{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:8px; display:flex; flex-direction:column; gap:8px;}
  @media (min-width:700px){ .tr-row{flex-direction:row; align-items:center; justify-content:space-between;} }
  .tr-left .name{font-weight:600; font-size:14.5px;}
  .tr-left .meta{font-size:12px; color:var(--text-muted); margin-top:3px;}
  .tr-right{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

  .auth-wrap{max-width:380px; margin:12vh auto 0; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:26px 22px; box-shadow:var(--shadow); text-align:center;}
  .auth-wrap h2{font-size:18px; margin:14px 0 6px;}
  .auth-wrap p{font-size:13px; color:var(--text-muted); margin:0 0 18px;}
  .auth-wrap input{width:100%; margin-bottom:12px; text-align:center;}
  .auth-msg{font-size:12.5px; padding:10px 12px; border-radius:9px; margin-top:12px;}
  .auth-msg.ok{background:var(--success-soft); color:var(--success);}
  .auth-msg.err{background:var(--danger-soft); color:var(--danger);}
  .config-warn{max-width:520px; margin:10vh auto; background:var(--warning-soft); color:var(--warning); border-radius:14px; padding:20px; font-size:13.5px; line-height:1.6;}
  .config-warn code{background:rgba(0,0,0,.08); padding:2px 6px; border-radius:5px;}

  ::selection{background:var(--accent-soft);}
</style>
</head>

    if(n===null||n===undefined||n===''||isNaN(n)) return '—';

  function todayStrDMY(){ var d=new Date(); return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear(); }
  function sortKey(s){ if(!s) return '0000-00-00'; var p=s.split('/'); if(p.length===3) return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0'); return s; }
  function el(tag, attrs, children){
    var e = document.createElement(tag); attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k==='class') e.className = attrs[k];
      else if(k==='html') e.innerHTML = attrs[k];
      else if(k.indexOf('on')===0) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else if(attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return e;
  }

  /* ---------------- data layer (Supabase) ---------------- */
  async function fetchAll(){
    var pr = await sb.from('projects').select('*').order('id');
    var by = await sb.from('buyers').select('*').order('id');
    var pa = await sb.from('payments').select('*').order('id');
    var cr = await sb.from('cost_revenue').select('*').order('id');
    if(pr.error || by.error || pa.error || cr.error){
      console.error(pr.error||by.error||pa.error||cr.error);
      return;
    }
    state.projects = pr.data.map(function(p){
      return {
        id: p.id, name: p.name,
        buyers: by.data.filter(function(b){ return b.project_id===p.id; }).map(function(b){
          var payments = pa.data.filter(function(x){ return x.buyer_id===b.id; });
          var totalPaid = payments.reduce(function(s,x){ return s+(Number(x.amount)||0); },0);
          return {
            id: b.id, name: b.name, propertyType: b.property_type, floor: b.floor, date: b.sale_date,
            totalPrice: b.total_price, brokerFee: b.broker_fee, brokerFeeStatus: b.broker_fee_status, notes: b.notes,
            payments: payments, totalPaid: totalPaid,
            remainingBalance: (b.total_price===null||b.total_price===undefined) ? 'N/A' : (b.total_price-totalPaid)
          };
        }),
        expenses: cr.data.filter(function(x){ return x.project_id===p.id; }).map(function(x){
          return { id:x.id, date:x.date, description:x.description, category:x.category, amount:x.amount, type: x.type==='Revenue'?'income':'expense' };
        })
      };
    });
  }

  function activeProject(){ return state.projects.find(function(p){ return p.id===state.activeProjectId; }); }

  async function refreshAndRender(){ await fetchAll(); render(); }

  /* ---------------- auth ---------------- */
  function loadPrefs(){
    try{
      var th = localStorage.getItem('mesken_theme'); if(th) state.theme = th;
      var lg = localStorage.getItem('mesken_lang'); if(lg) state.lang = lg;
      var mh = localStorage.getItem('mesken_money_hidden'); if(mh !== null) state.moneyHidden = (mh === '1');
    }catch(e){}
  }

  async function fetchRole(){
    if(!state.session){ state.role=null; state.roleLoaded=true; return; }
    try{
      var res = await sb.from('user_roles').select('role,project_access').eq('email', state.session.user.email).maybeSingle();
      if(res.data){ state.role = res.data.role; state.projectAccess = res.data.project_access; }
      else { state.role = null; }
    }catch(e){ state.role = null; }
    state.roleLoaded = true;
  }

  async function initAuth(){
    loadPrefs();
    if(!CONFIGURED){ render(); return; }
    var res = await sb.auth.getSession();
    state.session = res.data.session;
    sb.auth.onAuthStateChange(function(_event, session){
      state.session = session;
      if(session && !state.loaded){ loadAppData(); } else { render(); }
    });
    if(state.session){ await loadAppData(); } else { render(); }
  }

  async function loadAppData(){
    await fetchRole();
    if(!state.role){ render(); return; }
    await fetchAll();
    state.loaded = true;
    render();
    setupRealtime();
  }

  /* ---------------- live sync: auto-refresh when anyone changes data ---------------- */
  var realtimeDebounce = null;
  function setupRealtime(){
    if(state.subscribed || !sb) return;
    state.subscribed = true;
    function onChange(){
      clearTimeout(realtimeDebounce);
      realtimeDebounce = setTimeout(function(){ fetchAll().then(render); }, 400);
    }
    sb.channel('mesken-live-changes')
      .on('postgres_changes', {event:'*', schema:'public', table:'projects'}, onChange)
      .on('postgres_changes', {event:'*', schema:'public', table:'buyers'}, onChange)
      .on('postgres_changes', {event:'*', schema:'public', table:'payments'}, onChange)
      .on('postgres_changes', {event:'*', schema:'public', table:'cost_revenue'}, onChange)
      .subscribe();
  }
  function teardownRealtime(){
    if(sb){ sb.removeAllChannels(); }
    state.subscribed = false;
  }

  /* ---------------- Excel export (same as before, from fetched data) ---------------- */
  function autoWidth(ws, rows){
    if(!rows || !rows.length) return;
    var keys = Object.keys(rows[0]);
    ws['!cols'] = keys.map(function(k){
      var maxLen = String(k).length;
      rows.forEach(function(r){ var v = r[k]; var len = v===null||v===undefined ? 0 : String(v).length; if(len>maxLen) maxLen=len; });
      return { wch: Math.min(Math.max(maxLen+2, 10), 42) };
    });
  }
  function addSheet(wb2, rows, name){
    var ws = XLSX.utils.json_to_sheet(rows);
    autoWidth(ws, rows);
    XLSX.utils.book_append_sheet(wb2, ws, name);
  }

  function exportProjectToExcel(proj){
    if(typeof XLSX==='undefined'){ alert('Excel export library did not load.'); return; }
    var wb2 = XLSX.utils.book_new();
    var buyerRows = proj.buyers.map(function(b){ return {'No.':b.id,'Name':b.name,'Property Type':b.propertyType,'Floor':b.floor,'Sale Date':b.date,'Total Price (ETB)':b.totalPrice,'Total Paid (ETB)':b.totalPaid,'Remaining (ETB)':b.remainingBalance,'Broker Fee (ETB)':b.brokerFee,'Broker Status':b.brokerFeeStatus,'Notes':b.notes}; });
    addSheet(wb2, buyerRows, 'Buyers');
    var payRows = []; proj.buyers.forEach(function(b){ b.payments.forEach(function(p){ payRows.push({'Buyer':b.name,'Date':p.date,'Amount (ETB)':p.amount,'Note':p.note||''}); }); });
    addSheet(wb2, payRows, 'Payments');
    var costRows = proj.expenses.filter(function(x){return x.type!=='income';}).map(function(x){ return {'Date':x.date,'Description':x.description,'Category':x.category,'Amount (ETB)':x.amount}; });
    addSheet(wb2, costRows, 'Costs');
    var revRows = proj.expenses.filter(function(x){return x.type==='income';}).map(function(x){ return {'Date':x.date,'Description':x.description,'Category':x.category,'Amount (ETB)':x.amount}; });
    addSheet(wb2, revRows, 'Revenue');
    XLSX.writeFile(wb2, proj.name.replace(/[^\w\-]+/g,'_')+'.xlsx');
  }
  function exportPortfolioToExcel(){
    if(typeof XLSX==='undefined'){ alert('Excel export library did not load.'); return; }
    var wb2 = XLSX.utils.book_new();
    var overview = state.projects.map(function(p){
      var s = projectSummary(p);
      return {'Project':p.name,'Buyers':p.buyers.length,'Sales Value':s.salesValue,'Collected':s.collected,'Outstanding':s.outstanding,'Costs':s.expenses,'Other Income':s.income,'Net Cash':s.net};
    });
    addSheet(wb2, overview, 'Portfolio Overview');

    var usedNames = {};
    function uniqueSheetName(base){
      var name = base.replace(/[^\w]+/g,'_').slice(0,28) || 'Sheet';
      var candidate = name; var n = 1;
      while(usedNames[candidate]){ n++; candidate = (name.slice(0,26))+'_'+n; }
      usedNames[candidate] = true;
      return candidate;
    }

    state.projects.forEach(function(p){
      var tag = p.name.replace(/[^\w]+/g,'').slice(0,10) || ('P'+p.id);
      var buyerRows = p.buyers.map(function(b){ return {'No.':b.id,'Name':b.name,'Property Type':b.propertyType,'Floor':b.floor,'Sale Date':b.date,'Total Price (ETB)':b.totalPrice,'Total Paid (ETB)':b.totalPaid,'Remaining (ETB)':b.remainingBalance,'Broker Fee (ETB)':b.brokerFee,'Broker Status':b.brokerFeeStatus,'Notes':b.notes}; });
      addSheet(wb2, buyerRows, uniqueSheetName(tag+'_Buyers'));

      var payRows = []; p.buyers.forEach(function(b){ b.payments.forEach(function(pay){ payRows.push({'Buyer':b.name,'Date':pay.date,'Amount (ETB)':pay.amount,'Note':pay.note||''}); }); });
      addSheet(wb2, payRows, uniqueSheetName(tag+'_Payments'));

      var costRows = p.expenses.filter(function(x){return x.type!=='income';}).map(function(x){ return {'Date':x.date,'Description':x.description,'Category':x.category,'Amount (ETB)':x.amount}; });
      addSheet(wb2, costRows, uniqueSheetName(tag+'_Costs'));

      var revRows = p.expenses.filter(function(x){return x.type==='income';}).map(function(x){ return {'Date':x.date,'Description':x.description,'Category':x.category,'Amount (ETB)':x.amount}; });
      addSheet(wb2, revRows, uniqueSheetName(tag+'_Revenue'));
    });

    XLSX.writeFile(wb2, 'Mesken_Real_Estate_Portfolio.xlsx');
  }

  function projectSummary(proj){
    var s = { salesValue:0, collected:0, outstanding:0, expenses:0, income:0, brokerOwed:0, brokerPaid:0 };
    proj.buyers.forEach(function(b){
      if(typeof b.totalPrice==='number') s.salesValue += b.totalPrice;
      s.collected += Number(b.totalPaid)||0;
      if(typeof b.remainingBalance==='number') s.outstanding += b.remainingBalance;
      if(b.brokerFee){ if(b.brokerFeeStatus==='Owed') s.brokerOwed += Number(b.brokerFee)||0; if(b.brokerFeeStatus==='Paid') s.brokerPaid += Number(b.brokerFee)||0; }
    });
    proj.expenses.forEach(function(x){ if(x.type==='income') s.income += Number(x.amount)||0; else s.expenses += Number(x.amount)||0; });
    s.net = s.collected + s.income - s.expenses;
    return s;
  }
  function portfolioSummary(){
    var s = {salesValue:0,collected:0,outstanding:0,expenses:0,income:0,net:0};
    state.projects.forEach(function(p){ var ps=projectSummary(p); s.salesValue+=ps.salesValue; s.collected+=ps.collected; s.outstanding+=ps.outstanding; s.expenses+=ps.expenses; s.income+=ps.income; s.net+=ps.net; });
    return s;
  }

  async function doSignIn(email, password){
    if(!email || email.indexOf('@')===-1 || !password){ state.authMsg={kind:'err',text:t('signInError')}; render(); return; }
    state.authBusy = true; state.authMsg = null; render();
    var res = await sb.auth.signInWithPassword({ email: email, password: password });
    state.authBusy = false;
    if(res.error){ state.authMsg = {kind:'err', text: t('signInError')}; render(); return; }
    state.session = res.data.session;
    await loadAppData();

    var close = function(){ state.modal=null; render(); };
    var m = el('div',{class:'modal'});
    m.appendChild(el('div',{class:'drawer-head'},[el('h2',{style:'margin:0;font-size:18px;'},[t('addBuyerTitle')]), el('span',{class:'close-x', onclick:close},['×'])]));
    var name = el('input',{type:'text', placeholder:t('name')});
    var ptypeOptions = [['House only',t('houseOnly')],['House & Shop',t('houseShop')],['Shop only',t('shopOnly')],['2 Houses only',t('twoHouses')],['1 House + 2 Shops',t('houseTwoShops')],['Other',t('other')]];
    var ptype = el('select',{},ptypeOptions.map(function(o){ return el('option',{value:o[0]},[o[1]]); }));
    var floor = el('input',{type:'text', placeholder:t('floor')});
    var price = el('input',{type:'number', placeholder:t('totalPrice')});
    var down = el('input',{type:'number', placeholder:t('downPayment')});
    var date = el('input',{type:'text', placeholder:t('saleDate'), value: todayStrDMY()});
    var notes = el('textarea',{placeholder:t('notes'), rows:2});
    m.appendChild(el('div',{class:'field'},[el('label',{},[t('name')]), name]));
    m.appendChild(el('div',{class:'grid2'},[el('div',{class:'field'},[el('label',{},[t('propertyType')]), ptype]), el('div',{class:'field'},[el('label',{},[t('floor')]), floor])]));
    m.appendChild(el('div',{class:'grid2'},[el('div',{class:'field'},[el('label',{},[t('totalPrice')]), price]), el('div',{class:'field'},[el('label',{},[t('downPayment')]), down])]));
    m.appendChild(el('div',{class:'field'},[el('label',{},[t('saleDate')]), date]));
    m.appendChild(el('div',{class:'field'},[el('label',{},[t('notes')]), notes]));
    var actions = el('div',{class:'form-actions'});
    actions.appendChild(el('button',{class:'btn btn-ghost', onclick:close},[t('cancel')]));
    actions.appendChild(el('button',{class:'btn btn-primary', onclick:function(){
      if(!name.value.trim()){ alert(t('enterBuyerName')); return; }
      var downAmt = parseFloat(down.value)||0;
      sb.from('buyers').insert({
        project_id: proj.id, name: name.value.trim(), property_type: ptype.value, floor: floor.value||null,
        sale_date: date.value||todayStrDMY(), total_price: price.value?parseFloat(price.value):null, notes: notes.value||''
      }).select().single().then(function(res){
        if(res.error || !res.data){ alert(t('saveError')); return; }
        var newId = res.data.id;
        var after = function(){ state.modal=null; refreshAndRender(); };
        if(downAmt>0){
          sb.from('payments').insert({buyer_id:newId, date:date.value||todayStrDMY(), amount:downAmt, note:'Down payment'}).then(after);
        } else { after(); }
      });
    }},[t('addBuyerBtn')]));
    m.appendChild(actions);
    return overlayWrap('modal', m, close);
  }

  function renderAddEntryModal(){
    var proj = activeProject();
    var type = state.entryType || 'expense';
    var close = function(){ state.modal=null; render(); };
    var m = el('div',{class:'modal'});
    m.appendChild(el('div',{class:'drawer-head'},[el('h2',{style:'margin:0;font-size:18px;'},[type==='income'?t('addRevenueTitle'):t('addCostTitle')]), el('span',{class:'close-x', onclick:close},['×'])]));
    var desc = el('input',{type:'text', placeholder:t('description')});
    var catList = type==='income'?REVENUE_CATEGORIES:COST_CATEGORIES;
    var cat = el('select',{},catList.map(function(o){ return el('option',{value:o},[o]); }));
    var amt = el('input',{type:'number', placeholder:t('amount')});
    var date = el('input',{type:'text', placeholder:t('date'), value: todayStrDMY()});
    m.appendChild(el('div',{class:'field'},[el('label',{},[t('description')]), desc]));
    m.appendChild(el('div',{class:'grid2'},[el('div',{class:'field'},[el('label',{},[t('category')]), cat]), el('div',{class:'field'},[el('label',{},[t('amount')]), amt])]));
    m.appendChild(el('div',{class:'field'},[el('label',{},[t('date')]), date]));
    var actions = el('div',{class:'form-actions'});
    actions.appendChild(el('button',{class:'btn btn-ghost', onclick:close},[t('cancel')]));
    actions.appendChild(el('button',{class:'btn btn-primary', onclick:function(){
      var a = parseFloat(amt.value);
      if(!desc.value.trim()||!a||a<=0){ alert(t('enterDescAmount')); return; }
      sb.from('cost_revenue').insert({
        project_id: proj.id, type: type==='income'?'Revenue':'Cost', category: cat.value, description: desc.value.trim(), amount: a, date: date.value||todayStrDMY()
      }).then(function(res){ if(res.error){ alert(t('saveError')); return; } state.modal=null; refreshAndRender(); });
    }},[t('addEntry')]));
    m.appendChild(actions);
    return overlayWrap('modal', m, close);
  }

  function renderProjectFormModal(targetId){
    var isRename = !!targetId;
    var target = isRename ? state.projects.find(function(p){ return p.id===targetId; }) : null;
    var close = function(){ state.modal=null; state.renameTargetId=null; render(); };
    var m = el('div',{class:'modal'});
    m.appendChild(el('div',{class:'drawer-head'},[el('h2',{style:'margin:0;font-size:18px;'},[isRename?t('renameProject'):t('newProjectTitle')]), el('span',{class:'close-x', onclick:close},['×'])]));
    var name = el('input',{type:'text', placeholder:t('projName'), value: isRename?target.name:''});
    m.appendChild(el('div',{class:'field'},[el('label',{},[t('name')]), name]));
    var actions = el('div',{class:'form-actions'});
    actions.appendChild(el('button',{class:'btn btn-ghost', onclick:close},[t('cancel')]));
    actions.appendChild(el('button',{class:'btn btn-primary', onclick:function(){
      if(!name.value.trim()){ alert(t('enterProjectName')); return; }
      if(isRename){
        sb.from('projects').update({name:name.value.trim()}).eq('id', target.id).then(function(res){ if(res.error){ alert(t('saveError')); return; } state.modal=null; state.renameTargetId=null; refreshAndRender(); });
      } else {
        if(state.projects.length >= MAX_PROJECTS){ alert(t('maxProjects')); return; }
        sb.from('projects').insert({name:name.value.trim()}).then(function(res){ if(res.error){ alert(t('saveError')); return; } state.modal=null; refreshAndRender(); });
      }
    }},[isRename?t('save'):t('create')]));
    m.appendChild(actions);
    return overlayWrap('modal', m, close);
  }

  initAuth();
})();
</script>
</body>
</html>
